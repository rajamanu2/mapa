# This entire configuration replaces the image's default configuration. There
# is no static root, console server, API location or health route here.
worker_processes 1;
pid /tmp/mapa-edge.pid;
error_log /dev/null crit;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_header_timeout 5s;
    client_body_timeout 5s;
    client_max_body_size 1k;
    keepalive_timeout 0;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;

    # Test the original URI too: normalized /%6dedia or /x/../media must not
    # accidentally become additional public endpoints.
    map $request_uri $mapa_media_path {
        default 0;
        ~^/media(\?sample-rate=(8000|16000))?$ 1;
    }
    map $http_upgrade $mapa_websocket {
        default 0;
        ~*^websocket$ 1;
    }
    limit_req_zone $server_name zone=mapa_handshakes:1m rate=5r/s;
    limit_conn_zone $server_name zone=mapa_connections:1m;

    server {
        listen 8080 default_server;
        server_name _;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 3s;

        location = /media {
            if ($mapa_media_path = 0) { return 404; }
            if ($request_method != GET) { return 405; }
            if ($mapa_websocket = 0) { return 426; }
            if ($http_origin != "") { return 403; }

            auth_basic "MAPA voice intake";
            auth_basic_user_file /run/mapa-auth/voice.htpasswd;
            limit_req zone=mapa_handshakes burst=20 nodelay;
            limit_req_status 429;
            limit_conn mapa_connections 12;
            limit_conn_status 429;

            # This value is fixed and cannot be supplied by the caller. A
            # resolver variable survives a local voice-bridge container restart.
            set $mapa_voice_upstream "voice-bridge:8789";
            proxy_pass http://$mapa_voice_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host "voice-bridge";
            proxy_set_header Upgrade "websocket";
            proxy_set_header Connection "upgrade";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Origin $http_origin;
            proxy_set_header Cookie "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "https";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 70s;
            proxy_send_timeout 70s;
        }

        location / { return 404; }
    }
}
