server {
    listen       4200;
    server_name  localhost;
    server_tokens off;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;

    # Only intentional licence/source releases may be downloaded. Application
    # JavaScript is necessarily public; private files and debug maps are not.
    location = /mapa-source.zip { return 404; }
    location = /downloads/MAPA-Console-Android-Source.zip { root /usr/share/nginx/html; limit_except GET { deny all; } try_files $uri =404; }
    location ~ ^/downloads/MAPA-Crew-(?:1\.12\.[012]-Install-Pack|Trial-1\.(?:10|11)\.0)\.zip$ { root /usr/share/nginx/html; limit_except GET { deny all; } try_files $uri =404; }
    location ~* \.(?:map|php|phtml|py|ps1|sh|pem|key|p12|pfx|jks|keystore|dump|old|orig|save|swp|zip|tar|tgz|gz|7z|rar|env|sql|sqlite|sqlite3|log|bak)(?:$|/) { return 404; }
    location ~* ^/(?:vendor|node_modules|storage|config|tests|tmp|output|outputs|private|raw-console|backups)(?:/|$) { return 404; }
    location ~ (^|/)\. { return 404; }

    # Same-origin staff API. Docker DNS is resolved again after API replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location ^~ /mapa/text/v1/ {
        set $mapa_api http://application:8000;
        proxy_pass $mapa_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        client_max_body_size 256k;
        access_log off;
    }

    location ^~ /mapa/voice/v1/ {
        set $mapa_api http://application:8000;
        proxy_pass $mapa_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_read_timeout 35s;
        client_max_body_size 128k;
        access_log off;
    }
    location ^~ /mapa/mobile/v1/ {
        set $mapa_api http://application:8000;
        proxy_pass $mapa_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        client_max_body_size 32k;
        access_log off;
    }

    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html =404;
    }

     # Serve runtime config with no cache
    location = /fleetbase.config.json {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        try_files /fleetbase.config.json @config_fallback;
    }

    location @config_fallback {
        return 200 '{}';
    }
}
